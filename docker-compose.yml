services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 (not 5432) on purpose: many dev machines already run a
      # native/local Postgres on 5432, and that would silently steal this
      # container's traffic. Container-internal port stays 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
